modLoader = "javafml"
loaderVersion = "[36,)"
license = "MIT"

[[mods]]
modId = "bte"
version = "${mod_version}"
displayName = "Botamochi Transit Expansion"
authors = "botamochi129"
description = ""
logoFile = "icon.png"

[[mixins]]
# Forge 1.20.1 registers mixin configs from the jar manifest attribute
# "MixinConfigs: bte.mixins.json" (see the jar/runModJar tasks in build.gradle).
# This table is kept for loader versions that still read it.
config = "bte.mixins.json"

[[dependencies.bte]]
modId = "forge"
mandatory = true
versionRange = "[36,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.bte]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.bte]]
modId = "mtr"
mandatory = true
versionRange = "[4.0.4,4.1)"
ordering = "NONE"
side = "BOTH"